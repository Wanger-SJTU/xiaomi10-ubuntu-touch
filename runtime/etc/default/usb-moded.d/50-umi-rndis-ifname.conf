# umi: the USB gadget network function is g_ether backed and its netdev is
# named usb0. usb-moded autodetection used to fall back to "rndis0", which made
# every network USB mode fail with "network interface rndis0 does not exist"
# and developer mode could never be enabled.
#
# Setting these two variables makes ubports-usb-moded-configurator skip
# autodetection and generate the modes with the correct interface name.
RNDIS_IFNAME=usb0
RNDIS_FUNCTION=rndis.usb0
